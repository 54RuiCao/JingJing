[package]
name = "jingjing"
version = "0.1.0"
description = "鲸鲸：本地优先的 AI 阅读器"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "jingjing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
tauri-plugin-dialog = "2.7.3"
sha2 = "0.10.9"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
